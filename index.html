<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FaceBox — Escolha a versão</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0f172a;color:white;padding:24px}
.container{text-align:center;max-width:600px}
h1{font-size:2.5rem;font-weight:800;margin-bottom:8px;letter-spacing:-1px}
h1 span{color:#3b82f6}
p{color:rgba(255,255,255,0.6);font-size:1.1rem;margin-bottom:48px}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:20px}
a{text-decoration:none}
.card{padding:40px 24px;border-radius:20px;border:2px solid rgba(255,255,255,0.1);transition:all 0.3s;cursor:pointer}
.card:hover{transform:translateY(-4px);box-shadow:0 20px 60px rgba(0,0,0,0.3)}
.card-azul{background:linear-gradient(135deg,#1e3a5f,#2563eb)}
.card-azul:hover{border-color:#3b82f6}
.card-verde{background:linear-gradient(135deg,#134e3a,#059669)}
.card-verde:hover{border-color:#34d399}
.card h2{color:white;font-size:1.3rem;margin-bottom:8px}
.card p{color:rgba(255,255,255,0.7);font-size:0.9rem;margin-bottom:0}
</style>
</head>
<body>
<div class="container">
<h1>Face<span>Box</span></h1>
<p>Escolha a versão da Landing Page para visualizar</p>
<div class="cards">
<a href="azul.html">
<div class="card card-azul">
<h2>Versão Azul</h2>
<p>Tech, profissional, moderno</p>
</div>
</a>
<a href="verde.html">
<div class="card card-verde">
<h2>Versão Verde</h2>
<p>Confiança, segurança, solidez</p>
</div>
</a>
</div>
</div>
</body>
</html>
